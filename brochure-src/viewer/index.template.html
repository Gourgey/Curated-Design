<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Byron Penthouse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#1d1a17;font-family:Inter,sans-serif;color:#cfd6dc}
body{position:relative;height:100vh;min-height:620px;overflow:hidden}
.stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0);touch-action:pan-y}
.stf__wrapper{position:relative;width:100%;box-sizing:border-box}
.stf__parent canvas{position:absolute;width:100%;height:100%;left:0;top:0}
.stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2000px}
.stf__item{display:none;position:absolute;transform-style:preserve-3d}
.stf__outerShadow,.stf__innerShadow,.stf__hardShadow,.stf__hardInnerShadow{position:absolute;left:0;top:0}
.stage{position:absolute;inset:44px 90px 52px;display:flex;align-items:center;justify-content:center}
#book{margin:0 auto}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:0;background:#0f0d0b;color:#fff;font-size:22px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
.nav:hover{background:#b08d57}.nav:disabled{opacity:.25;cursor:default}
#prev{left:20px}#next{right:20px}
.top{pointer-events:none;position:absolute;top:14px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#a39784}
.count{pointer-events:none;position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.12em;color:#a39784}
@media(max-width:700px){.stage{inset:44px 12px 70px}.nav{top:auto;bottom:10px;transform:none;width:44px;height:44px}#prev{left:calc(50% - 90px)}#next{right:calc(50% - 90px)}.count{bottom:24px}}
</style></head><body>
<div class="top">The Byron Penthouse</div>
<button class="nav" id="prev" aria-label="Previous page">‹</button>
<div class="stage"><div id="holder"></div><template id="tpl"><div id="book">
<div class="page"><img src="pages/p1.jpg" alt="Cover"></div>
<div class="page"><img src="pages/p2.jpg" alt="The residence"></div>
<div class="page"><img src="pages/p3.jpg" alt="Principal suite sitting room"></div>
<div class="page"><img src="pages/p4.jpg" alt="Principal bathroom"></div>
<div class="page"><img src="pages/p5.jpg" alt="Guest en suite"></div>
<div class="page"><img src="pages/p6.jpg" alt="Arrange a viewing"></div>
</div></template></div>
<button class="nav" id="next" aria-label="Next page">›</button>
<div class="count" id="count"></div>
<script src="page-flip.js"></script>
<script>
const stage=document.querySelector('.stage'),holder=document.getElementById('holder'),tpl=document.getElementById('tpl');
const prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
let pf=null,s=null,cur=0;
function size(){const r=stage.getBoundingClientRect();let h=Math.max(r.height,200),w=h*1.4144;if(w>r.width){w=r.width;h=w/1.4144}return{w:Math.floor(w),h:Math.floor(h)}}
function upd(){if(!pf)return;const i=pf.getCurrentPageIndex(),n=pf.getPageCount();cur=i;prev.disabled=i===0;next.disabled=i>=n-1;count.textContent=`Page ${i+1} of ${n}`}
function build(){try{if(pf){pf.destroy();pf=null}}catch(e){}holder.innerHTML='';holder.appendChild(tpl.content.cloneNode(true));s=size();holder.style.width=s.w+'px';
 pf=new St.PageFlip(document.getElementById('book'),{width:s.w,height:s.h,size:'fixed',showCover:false,usePortrait:true,maxShadowOpacity:0.5,mobileScrollSupport:false,flippingTime:900,startPage:cur});
 pf.loadFromHTML(document.querySelectorAll('#book .page'));pf.on('flip',upd);upd()}
prev.onclick=()=>pf&&pf.flipPrev();next.onclick=()=>pf&&pf.flipNext();
document.addEventListener('keydown',e=>{if(!pf)return;if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev()});
let t,lastW=0,lastH=0;function onResize(){const r=stage.getBoundingClientRect();if(Math.abs(r.width-lastW)<8&&Math.abs(r.height-lastH)<8)return;lastW=r.width;lastH=r.height;clearTimeout(t);t=setTimeout(build,250)}
addEventListener('resize',onResize);
function start(){const r=stage.getBoundingClientRect();lastW=r.width;lastH=r.height;build()}
if(document.readyState==='complete')start();else addEventListener('load',start);
</script></body></html>
